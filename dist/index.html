<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173c32">
  <meta name="description" content="Olly’s household bills, policies and due dates in one place.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; frame-src blob:; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Olly’s Outgoings</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#home">
        <img src="icons/icon-192.png" width="41" height="41" alt="">
        <span>Olly’s <strong>Outgoings</strong></span>
      </a>
      <nav id="nav" class="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-footer">
        <span class="privacy-icon" id="privacy-icon"></span>
        <div><strong>Private by design</strong><small>Bills stay on this device</small></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span class="breadcrumb" id="breadcrumb">Overview</span>
        <span class="topbar-right">
          <button class="button subtle install-button" type="button" data-action="install" id="install-top">Install app</button>
          <img class="top-avatar" src="olly.webp" width="34" height="34" alt="Olly">
        </span>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading" role="status">Opening your Outgoings…</div>
        <noscript>Olly’s Outgoings needs JavaScript to save records on this device.</noscript>
      </main>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="attachment-input" accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.heic,.heif,application/pdf,image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif" hidden>
  <input type="file" id="backup-input" accept=".json,application/json" hidden>
</body>
</html>
